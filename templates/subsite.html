<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Shown in the title bar of the site, and as the tab name when the
       page is opened on its own. -->
  <title>Page title</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ---- Base: the same look as the rest of the site. Keep this part. ---- */
    html { background-color: #0f1214; }

    body {
      margin: 0;
      color: #e6e2d6;
      font-family: Calibri, sans-serif;
      font-size: 18px;
      line-height: 1.6;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      color: #e6e2d6;
      font-size: 28px;
      border-bottom: 1px solid #555;
      padding-bottom: 8px;
    }

    h2, h3 { color: #e6e2d6; }
    h2 { font-size: 22px; }
    h3 { font-size: 18px; }

    a { color: #e5f5ff; }
    a:hover { color: #fff6e5; text-decoration: underline; }

    blockquote {
      border-left: 3px solid #555;
      margin-left: 0;
      padding-left: 16px;
      color: #ccc;
    }

    img { max-width: 100%; height: auto; }

    hr { border: none; border-top: 1px solid #555; }

    /* The site's retro button. */
    .title-button {
      display: inline-block;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 16px;
      color: #e6e2d6;
      background-color: #0f1214;
      padding: 6px 16px;
      text-decoration: none;
      border: 2px solid;
      border-color: #666 #4d4d4d #5c5c5c #4d4d4d;
      box-shadow:
        inset 1px 1px 0 rgba(230, 226, 214, 0.08),
        inset -1px -1px 0 rgba(0, 0, 0, 0.6);
      white-space: nowrap;
    }

    .title-button:hover { background-color: #1a1e22; }

    .title-button:active {
      border-color: #111 #666 #666 #111;
      box-shadow:
        inset 1px 1px 0 rgba(0, 0, 0, 0.6),
        inset -1px -1px 0 rgba(230, 226, 214, 0.08);
      padding: 7px 15px 5px 17px;
    }

    /* ---- Your page: write your own styles below. ---- */
  </style>
</head>
<body>

  <!-- Write your page here. -->

</body>
</html>
